; PlatformIO Project Configuration — Arduino Nano Sensor Hub
; Controller 1 of 3 (Nano -> ESP32 #1 -> ESP32 #2). Sensor acquisition only.
;
; This lets the Nano build in CI / on a phone (GitHub Actions) alongside the two ESP32s.
; The sketch is an Arduino .ino in this folder, so src_dir points here.
; Hosts: DHT22 (D11), 2x HC-SR04 ultrasonic (D4-D7), reservoir flow (D2 INT0),
;        RS485/NPK (D8/D9/D10, SoftwareSerial), 6x capacitive soil (A0-A3,A6,A7),
;        BH1750 (I2C A4/A5), UART link to ESP32 #1 (D0/D1).

[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
; upload_port = COM3            ; <-- set to your Nano port (use nanoatmega328new for a 115200 bootloader)
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  claws/BH1750@^1.3.0
; SoftwareSerial and Wire ship with the Arduino AVR core.
