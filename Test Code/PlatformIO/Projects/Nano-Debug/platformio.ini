; PlatformIO Project Configuration File — ARDUINO NANO SENSOR HUB (DEBUG / FAKE)
; Controller 1 of 3 (Nano -> ESP32 #1 -> ESP32 #2).
;
; DEBUG BUILD: emits the SAME framed UART protocol as the production Nano (Nano/
; Nano.ino) but every sensor reading is FAKED (no DHT22/BH1750/NPK/ultrasonic/flow
; hardware needed). Drop-in for exercising ESP32 #1's parser, recovery, and UI.
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino

monitor_speed = 9600              ; matches the 9600 ESP32 #1 link baud
upload_port = COM13             ; <-- set to your Nano port
; No external libraries: all sensor values are synthesized in firmware.
