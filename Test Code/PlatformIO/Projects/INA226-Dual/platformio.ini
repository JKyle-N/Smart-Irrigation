; PlatformIO Project Configuration File -- Dual INA226 (CJMCU-226) detect + read test
; Standalone bench tool: no main firmware. Wiring and the address table are in src/main.cpp.
; Only Wire is used, so there are no external libraries.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Named on purpose: this PC also lists Bluetooth COM ports (COM3, COM6, COM8, COM10), and auto-detect
; can pick one of those. Change this if your board shows up on a different port.
upload_port = COM5
monitor_port = COM5

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
