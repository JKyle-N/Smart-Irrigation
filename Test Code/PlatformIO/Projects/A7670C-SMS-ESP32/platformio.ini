; PlatformIO Project Configuration File — A7670C SMS Test (ESP32)
; Converted from Test Code/A7670C_SMS_ESP32.ino
;
; A7670C 4G/LTE module on HW UART2: module TX -> GPIO16 (RX2), module RX -> GPIO17 (TX2).
; Module powered from its own 5-12 V / 2 A supply; common GND with the ESP32.
; Serial Monitor: 115200 baud. Commands: send / read / del / status / init / AT... / help
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes
; upload_port = COM8             ; <-- set to your ESP32 port

; No external libraries: HardwareSerial (Serial2) ships with the ESP32 Arduino core.
