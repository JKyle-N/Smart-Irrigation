; PlatformIO Project Configuration — ADS1115 detect + ACS758 current bench tool (ESP32 #1)
; Standalone: no main firmware, no UART to other controllers. Scans the I2C bus, confirms the
; ADS1115 answers at 0x48, and reads the ACS758 hall current sensor on A0 so the front-end can be
; verified before the firmware is asked to trust it. Current only — the ACS758 measures the current
; in a wire and reports nothing about voltage, so no voltage channel exists here.
;
; Wiring (ESP32 #1 I2C, matches ESP1/src/main.cpp:62-63):
;   SDA = GPIO21   SCL = GPIO22   ADS1115 VDD = 3.3 V (NOT 5 V — see the header in src/main.cpp)
;   ADS1115 A0 = ACS758 VIOUT via a 2:1 divider   A1/A2/A3 = unused
;   ADS1115 ADDR -> GND = 0x48
;
; Only Wire is used — the ADS1115 is driven from its registers directly, no external libraries.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; upload_port = COM5             ; <-- set to your ESP32 #1 port
