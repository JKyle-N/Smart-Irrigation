; PlatformIO Project Configuration — ADS1115 I2C detect + V/I bench tool (ESP32 #1)
; Standalone: no main firmware, no UART to other controllers. Interactive Serial tool that
; scans the I2C bus, finds the ADS1115, and continuously reads the two battery-monitor
; channels so wiring can be verified before anything is trusted by the firmware.
;
; Wiring (ESP32 #1 I2C, matches ESP1/src/main.cpp:62-63):
;   SDA = GPIO21   SCL = GPIO22   ADS1115 VDD = 3.3 V (NOT 5 V — see the header in src/main.cpp)
;   ADS1115 A0 = CURRENT sensor output   (via divider if the sensor runs on 5 V)
;   ADS1115 A1 = VOLTAGE sense           (via divider — battery volts always exceed the ADC range)
;   ADDR -> GND = 0x48 (default). VDD=0x49, SDA=0x4A, SCL=0x4B.
;
; Only Wire is used — the ADS1115 is driven from its registers directly, no external libraries.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; upload_port = COM5             ; <-- set to your ESP32 #1 port
