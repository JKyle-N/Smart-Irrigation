; PlatformIO Project Configuration — ESP1 nonlinear ADC calibration bench tool
; Standalone (no main firmware / no UART / no other controllers). Interactive Serial
; tool that captures known-input calibration points on two opto-isolated ADC channels
; and fits a least-squares polynomial per channel, then prints + saves it to NVS.
;
; Wiring (ESP32 #1 / ADC1, input-only pins):
;   GPIO34 = CURRENT reading   GPIO35 = VOLTAGE reading
;   Keep the ADC-side signal within 0..3.3 V (ADC_11db reads ~0..3.1 V, clips above).
;   Common ground on the ADC side of the optocoupler.
; Only uses Preferences (NVS) — ships with the ESP32 Arduino core.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; upload_port = COM8             ; <-- set to your ESP32 #1 port
