; PlatformIO Project Configuration — ESP32 #2 PCF8575 relay sequence test
; Standalone wiring / I2C check: walks one relay ON up the bank (P0->P15),
; one at a time, 1 s gap, forever. No UART / no ESP1 / no main firmware.
;
; Wiring (match the real rig): PCF8575 SDA->GPIO21, SCL->GPIO22, addr 0x20,
; active-LOW (0xFFFF = all OFF). Only uses Wire (ships with the ESP32 core).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; upload_port = COM6             ; <-- set to your ESP32 #2 port
