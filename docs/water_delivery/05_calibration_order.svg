<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Order of the manual calibration</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="900" height="650" fill="#ffffff"/>
<text x="450" y="28" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">The order of the manual work</text>
<rect x="250" y="50" width="400" height="52" rx="8" fill="#eff6ff" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="76.0" r="14" fill="#2563eb"/><text x="276" y="81.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="302" y="72" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Tank shape</text>
<text x="302" y="90" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">taped 18 Nov; 2-min sensor check</text>
<line x1="450.0" y1="102" x2="450.0" y2="120" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="120" width="400" height="52" rx="8" fill="#eff6ff" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="146.0" r="14" fill="#2563eb"/><text x="276" y="151.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="302" y="142" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Tank litres points</text>
<text x="302" y="160" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">worth doing: the fill now trusts these litres</text>
<line x1="450.0" y1="172" x2="450.0" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="190" width="400" height="52" rx="8" fill="#eff6ff" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="216.0" r="14" fill="#2563eb"/><text x="276" y="221.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="302" y="212" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Transfer pump line</text>
<text x="302" y="230" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Transfer pump est: 5+ weighed runs, 10–45 s</text>
<line x1="450.0" y1="242" x2="450.0" y2="260" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="260" width="400" height="52" rx="8" fill="#eff6ff" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="286.0" r="14" fill="#2563eb"/><text x="276" y="291.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="302" y="282" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Check a fill</text>
<text x="302" y="300" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">forced run: last FILL_CHECK within ±1 L?</text>
<line x1="450.0" y1="312" x2="450.0" y2="330" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="330" width="400" height="52" rx="8" fill="#eff6ff" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="356.0" r="14" fill="#2563eb"/><text x="276" y="361.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="302" y="352" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Booster with drip pipe</text>
<text x="302" y="370" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Rate Booster = the seen: value</text>
<line x1="450.0" y1="382" x2="450.0" y2="400" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="400" width="400" height="52" rx="8" fill="#f0fdf4" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="426.0" r="14" fill="#15803d"/><text x="276" y="431.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="302" y="422" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Soil probes</text>
<text x="302" y="440" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Soil A1…C2: air, then water</text>
<line x1="450.0" y1="452" x2="450.0" y2="470" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="470" width="400" height="52" rx="8" fill="#f0fdf4" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="496.0" r="14" fill="#15803d"/><text x="276" y="501.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
<text x="302" y="492" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Water budget per column</text>
<text x="302" y="510" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">from the soil (§9): set WATER_BUDGET_L</text>
<line x1="450.0" y1="522" x2="450.0" y2="540" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="540" width="400" height="52" rx="8" fill="#f0fdf4" stroke="#374151" stroke-width="1.4"/>
<circle cx="276" cy="566.0" r="14" fill="#15803d"/><text x="276" y="571.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<text x="302" y="562" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Verify and correct</text>
<text x="302" y="580" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">moisture after watering → adjust the budget</text>
<path d="M650 286.0 C 720 286.0, 720 216.0, 656 216.0" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ara)"/>
<text x="712" y="255.0" font-size="11" fill="#c2410c" text-anchor="start" font-weight="normal">no: re-measure</text>
<path d="M250 566.0 C 180 566.0, 180 496.0, 244 496.0" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="186" y="535.0" font-size="11" fill="#15803d" text-anchor="end" font-weight="normal">repeat</text>
<text x="450" y="624" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">Steps 1–5 make the litres right. Steps 6–8 decide how many litres the plants need.</text>
</svg>
