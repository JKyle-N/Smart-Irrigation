<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Water budget from the soil</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="900" height="445" fill="#ffffff"/>
<text x="450" y="28" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">How many litres a column needs</text>
<polygon points="150,110 430,110 490,70 210,70" fill="#e7d7bd" stroke="#374151"/>
<polygon points="430,110 490,70 490,220 430,260" fill="#c9b08a" stroke="#374151"/>
<rect x="150" y="110" width="280" height="150" fill="#d6c4a8" stroke="#374151"/>
<path d="M190 110 q -8 40 4 80 t -6 60" fill="none" stroke="#7c5a32" stroke-width="1.4"/>
<path d="M245 110 q -8 40 4 80 t -6 60" fill="none" stroke="#7c5a32" stroke-width="1.4"/>
<path d="M300 110 q -8 40 4 80 t -6 60" fill="none" stroke="#7c5a32" stroke-width="1.4"/>
<path d="M355 110 q -8 40 4 80 t -6 60" fill="none" stroke="#7c5a32" stroke-width="1.4"/>
<path d="M410 110 q -8 40 4 80 t -6 60" fill="none" stroke="#7c5a32" stroke-width="1.4"/>
<text x="320.0" y="60" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">area A (m²): the soil the drip line wets</text>
<line x1="134" y1="110" x2="134" y2="260" stroke="#2563eb" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="128" y="185.0" font-size="12" fill="#2563eb" text-anchor="end" font-weight="normal">root depth d (m)</text>
<rect x="560" y="80" width="60" height="240" fill="#ffffff" stroke="#374151"/>
<rect x="560" y="176.0" width="60" height="57.6" fill="#bfdbfe" stroke="#2563eb"/>
<line x1="554" y1="176.0" x2="626" y2="176.0" stroke="#15803d" stroke-width="1.6"/>
<text x="632" y="180.0" font-size="12" fill="#15803d" text-anchor="start" font-weight="normal">θ_FC  field capacity (target)</text>
<line x1="554" y1="233.6" x2="626" y2="233.6" stroke="#c2410c" stroke-width="1.6"/>
<text x="632" y="237.60000000000002" font-size="12" fill="#c2410c" text-anchor="start" font-weight="normal">θ_start  when the probes say 35 %</text>
<line x1="554" y1="281.6" x2="626" y2="281.6" stroke="#6b7280" stroke-width="1.6"/>
<text x="632" y="285.6" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">wilting point (never reach)</text>
<text x="590.0" y="208.8" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">add</text>
<text x="590.0" y="70" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">water content θ (m³/m³)</text>
<rect x="60" y="340" width="800" height="90" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/>
<text x="80" y="368" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">budget (L) = A × d × (θ_FC − θ_start) × 1000 ÷ E</text>
<text x="80" y="394" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">E = how much of the water reaches the roots (drip: about 0.85–0.95).</text>
<text x="80" y="414" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Example (made-up numbers): 0.5 m² × 0.15 m × (0.30 − 0.18) × 1000 ÷ 0.9 = 10.0 L</text>
</svg>
