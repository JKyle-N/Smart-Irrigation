<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Where a column's litres come from</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="900" height="432" fill="#ffffff"/>
<text x="450" y="28" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold">Where a column's litres come from (web v.4)</text>
<rect x="20" y="120" width="130" height="150" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
<rect x="26" y="185" width="118" height="79" fill="#bfdbfe" stroke="none"/>
<text x="85" y="140" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Reservoir</text>
<text x="85" y="160" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">ultrasonic: % only</text>
<text x="85" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">(no basis for a fill)</text>
<rect x="185" y="165" width="120" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.4"/>
<text x="245" y="186" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Transfer pump</text>
<text x="245" y="201" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">70 % run + top-up</text>
<text x="245" y="216" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">from INV_ON</text>
<rect x="340" y="105" width="170" height="185" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
<rect x="346" y="190" width="158" height="94" fill="#bfdbfe" stroke="none"/>
<rect x="413" y="235" width="24" height="49" fill="#9ca3af" stroke="#374151"/>
<text x="425" y="125" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Mixing tank</text>
<text x="425" y="145" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">ultrasonic = the meter</text>
<text x="425" y="160" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">settle 60 s, measure,</text>
<text x="425" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">top-up if &gt; 0.8 L short</text>
<text x="425" y="230" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal">mixer</text>
<rect x="545" y="165" width="120" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.4"/>
<text x="605" y="186" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Booster pump</text>
<text x="605" y="201" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">until &lt; 5 %</text>
<text x="605" y="216" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">then 10 s more</text>
<rect x="700" y="120" width="180" height="150" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
<rect x="706" y="222" width="168" height="42" fill="#d6c4a8" stroke="none"/>
<text x="790" y="140" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Column A / B / C</text>
<text x="790" y="160" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">valve → drip pipe → soil</text>
<text x="790" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">probes decide WHEN,</text>
<text x="790" y="190" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">not HOW MUCH</text>
<line x1="150" y1="197" x2="185" y2="197" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="305" y1="197" x2="340" y2="197" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="510" y1="197" x2="545" y2="197" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="665" y1="197" x2="700" y2="197" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="330" y="46" width="190" height="40" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="425" y="63" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">Inverter + selector servo</text>
<text x="425" y="78" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">one AC pump at a time</text>
<line x1="360" y1="86" x2="260" y2="162" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ara)"/>
<line x1="490" y1="86" x2="590" y2="162" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ara)"/>
<rect x="20" y="312" width="860" height="108" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/>
<text x="36" y="336" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Fill:</text>
<text x="100" y="336" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">need = budget − (tank − floor);  1st run aims for 70 %:  t = (0.7 × need − start) ÷ (Q/60), at least 6 s</text>
<text x="36" y="360" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Check:</text>
<text x="100" y="360" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">after the settle, missing = goal − measured;  missing &gt; 0.8 L → top-up at the rate just seen (at most 2)</text>
<text x="36" y="384" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Deliver:</text>
<text x="100" y="384" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">the column gets the mixing tank's fall:  delivered = litres at start − litres at end</text>
<text x="36" y="408" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Budget:</text>
<text x="100" y="408" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">a fixed number per column (WATER_BUDGET_L, 5 L each, [TBD]) — you work it out from the soil (§9)</text>
</svg>
