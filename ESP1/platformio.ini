[platformio]
default_envs = esp32dev

; PlatformIO Project Configuration File — ESP32 #1 Master Controller
; Controller 2 of 3 (Nano -> ESP32 #1 -> ESP32 #2). Single decision-making authority.
;
; Hosts: Nano link (EspSoftwareSerial 16/17), ESP2 link (HW UART1 25/33),
;        A7670C (HW UART2 26/27), LCD+INA226+RTC+EEPROM (I2C 21/22),
;        microSD (SPI 23/19/18/5), 5 buttons, GPIO4 ESP2-power relay.
[env:esp32dev]
; Pinned: 6.9.0 ships Arduino core 2.0.17, which this firmware targets. An unpinned
; espressif32 resolves to the newest (8.x / core 3.x), where EspSoftwareSerial fails
; to link ("dangerous relocation: l32r: literal placed after use").
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM8             ; <-- set to your ESP32 #1 port

; WiFi + HTTPClient + SD + libs can exceed the default 1.3MB app partition.
; huge_app gives a 3MB app slot (no OTA; we log to SD, not SPIFFS).
board_build.partitions = huge_app.csv

lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  adafruit/RTClib@^2.1.4
  plerup/EspSoftwareSerial@^8.2.0
  bblanchon/ArduinoJson@^6.21.5
; SD, Wire, Preferences, HardwareSerial, WiFi, HTTPClient, WiFiClientSecure ship with the ESP32 Arduino core.

; ---------------------------------------------------------------------------
; Host-side unit tests for the pure maths in include/. No ESP32, no rig:
;     pio test -e native
; Requires a host C++ compiler on PATH. On Windows install MinGW-w64, e.g.
;     winget install BrechtSanders.WinLibs.POSIX.UCRT.LLVM
; test_build_src stays off (the default) so main.cpp -- which needs Arduino --
; is never dragged into the host build; the tests include the headers directly.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Iinclude
