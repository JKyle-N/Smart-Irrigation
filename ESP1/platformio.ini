; PlatformIO Project Configuration File — ESP32 #1 Master Controller
; Controller 2 of 3 (Nano -> ESP32 #1 -> ESP32 #2). Single decision-making authority.
;
; Hosts: Nano link (EspSoftwareSerial 16/17), ESP2 link (HW UART1 25/33),
;        SIM800L (HW UART2 26/27), LCD+INA226+RTC+EEPROM (I2C 21/22),
;        microSD (SPI 23/19/18/5), 5 buttons, GPIO4 ESP2-power relay.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM8             ; <-- set to your ESP32 #1 port

; WiFi + HTTPClient + SD + libs can exceed the default 1.3MB app partition.
; huge_app gives a 3MB app slot (no OTA; we log to SD, not SPIFFS).
board_build.partitions = huge_app.csv

lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  adafruit/RTClib@^2.1.4
  plerup/EspSoftwareSerial@^8.2.0
  robtillaart/INA226@^0.6.0
  bblanchon/ArduinoJson@^6.21.5
; SD, Wire, Preferences, HardwareSerial, WiFi, HTTPClient, WiFiClientSecure ship with the ESP32 Arduino core.
