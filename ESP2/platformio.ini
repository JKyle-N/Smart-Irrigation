[platformio]
default_envs = esp32dev

; PlatformIO Project Configuration File — ESP32 #2 Actuator Controller
; Controller 3 of 3 (Nano -> ESP32 #1 -> ESP32 #2). Executes work orders; owns "HOW".
;
; Hosts: ESP1 link (HW UART2 16/17), PZEM-004T (HW UART1 13/14),
;        PCF8575 actuator expander (I2C 21/22, raw driver — no lib),
;        8 flow sensors (interrupt, stage-based), pH/EC/ACS712 analog inputs.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM8

monitor_dtr = 0
monitor_rts = 0

lib_deps =
  mandulaj/PZEM-004T-v30@^1.1.2
; PCF8575 driven via raw I2C (Wire). Wire / HardwareSerial / esp_task_wdt ship with the core.

; ---------------------------------------------------------------------------
; Host-side unit tests for the pure maths in include/. No ESP32, no rig:
;     pio test -e native
; Requires a host C++ compiler on PATH. On Windows install MinGW-w64, e.g.
;     winget install BrechtSanders.WinLibs.POSIX.UCRT.LLVM
; test_build_src stays off (the default) so main.cpp -- which needs Arduino --
; is never dragged into the host build; the tests include the headers directly.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Iinclude
