; Settings shared by every calibration tool. Each tool's platformio.ini pulls this in, so these are the
; only lines to touch when your COM port changes.
;
; Why the port is named: this PC also lists Bluetooth COM ports (COM3, COM6, COM8, COM10), and PlatformIO's
; auto-detect can pick one of those. Device Manager > Ports shows the board's real port.

[ports]
esp32 = COM9
nano  = COM3

; The platforms are pinned, like the three firmwares. An unpinned espressif32 pulls 8.x / core 3.x.
[cal_esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_port = ${ports.esp32}
monitor_port = ${ports.esp32}
monitor_speed = 115200
; Type a whole line, see it as you type, and send it on Enter.
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF

[cal_nano]
platform = atmelavr@5.3.0
; Use nanoatmega328new if your Nano has the newer (115200 baud) bootloader.
board = nanoatmega328
framework = arduino
upload_port = ${ports.nano}
monitor_port = ${ports.nano}
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
