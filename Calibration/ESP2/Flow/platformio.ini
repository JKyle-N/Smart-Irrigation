; PlatformIO — 8x flow-sensor K-factor calibration bench tool (ESP32 #2)
; Standalone: no ESP1/UART. Serial 115200. Drives the paired pump/valve under a
; dead-man (hold-key keep-alive + hard cap) via the PCF8575; 3-run K + outlier check.
; PCF8575 SDA21/SCL22 addr 0x20, active-LOW. Wire ships with the ESP32 core.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM8            ; <-- set to your ESP32 #2 port
