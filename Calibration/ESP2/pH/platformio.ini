; PlatformIO — pH probe calibration bench tool (ESP32 #2)
; Standalone: no ESP1/UART. Serial 115200. Linear 2/3-point least-squares fit.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM8            ; <-- set to your ESP32 #2 port
; analogRead only — no external libraries.
