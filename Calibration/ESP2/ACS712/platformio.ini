; PlatformIO — ACS712 mixer-current calibration bench tool (ESP32 #2)
; Standalone: no ESP1/UART. Serial 115200. Captures zero-offset + optional sensitivity.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM8
; analogRead only — no external libraries.
