; PlatformIO — Flow-sensor PIN FINDER bench tool (ESP32 #2)
; Standalone: no ESP1/UART, drives NO actuators. Serial 115200. Watches all flow
; GPIOs at once and counts pulses so you can map each physical sensor to its pin.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM8            ; <-- set to your ESP32 #2 port
; Interrupt pulse counting only — no external libraries.
