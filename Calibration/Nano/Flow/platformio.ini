; PlatformIO — Reservoir flow K-factor calibration bench tool (Arduino Nano)
; Standalone: no ESP1/UART. Serial 115200. 3-run K-factor with median outlier check.
[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3
; Interrupt pulse counting only — no external libraries.
