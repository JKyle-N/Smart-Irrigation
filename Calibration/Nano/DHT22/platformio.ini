; PlatformIO — DHT22 calibration bench tool (Arduino Nano)
; Standalone: no ESP1/UART. Serial 115200. Captures temp/humidity offset trims.
[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
