; PlatformIO — Ultrasonic calibration bench tool (Arduino Nano)
; Standalone: no ESP1/UART. Serial 115200. Captures empty-tank reference distances.
[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3
; HC-SR04 driven with pulseIn — no external libraries.
