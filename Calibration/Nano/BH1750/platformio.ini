; PlatformIO — BH1750 light calibration bench tool (Arduino Nano)
; Standalone: no ESP1/UART. Serial 115200. Captures lux offset trim.
[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3
lib_deps =
  claws/BH1750@^1.3.0
; Wire ships with the Arduino AVR core.
