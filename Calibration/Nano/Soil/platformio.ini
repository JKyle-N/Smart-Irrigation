; PlatformIO — Soil moisture calibration bench tool (Arduino Nano)
; Standalone: no ESP1/UART. Serial 115200. Captures per-column air/water endpoints.
; The .ino in this folder is a normal Arduino sketch (open in Arduino IDE too).
[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3            ; <-- set to your Nano port (nanoatmega328new = 115200 bootloader)
; analogRead only — no external libraries.
