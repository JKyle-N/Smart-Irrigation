; PlatformIO — NPK 7-in-1 RS485 calibration bench tool (Arduino Nano)
; Standalone: no ESP1/UART. Serial 115200. Reads raw Modbus registers + guarded offset trim.
[platformio]
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3
; SoftwareSerial ships with the Arduino AVR core — no external libraries.
