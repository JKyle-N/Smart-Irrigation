; PlatformIO — ACS758 current calibration bench tool via ADS1115 I2C ADC (ESP32 #1)
; Standalone: no ESP2/Nano/UART. Serial 115200. Captures zero-offset + sensitivity.
; I2C on 21/22 (the same bus the real ESP1 firmware uses for LCD/RTC/INA226).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM5
; Wire only — the ADS1115 is driven from its registers directly, no external libraries.
