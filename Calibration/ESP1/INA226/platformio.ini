; INA226 calibration: solar, main battery (both behind the ISO1540) and the secondary battery.
; Flash it to ESP1 itself, so `save` reaches the NVS the firmware reads.
[platformio]
extra_configs = ../../common.ini
default_envs = esp32dev

[env:esp32dev]
extends = cal_esp32

; For a bench check without ESP1. Nothing can be saved on this board: `show` prints the values to paste.
[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
upload_port = ${ports.nano}
monitor_port = ${ports.nano}
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
