; PlatformIO Project Configuration File — ESP32 #1, PRESENTATION VARIANT
; Standalone copy of ESP1/src/main.cpp. The only differences are the #if FORCE_BUILD blocks:
;   - "Run Cycle Now" + "Run Mode" Settings rows and the RUNDEMO SMS (start a cycle on demand,
;     bypassing the schedule window / soil threshold / once-per-day / NPK-gap gates)
;   - Run Mode OFFLINE plays the full cycle with no ESP2 and no actuators
;   - Nutrient A (CALCINIT) always doses the minimum resolvable amount so it is observable
; Same board/libraries as the production ESP1 build. Flash this instead of ESP1 for a demo.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM8             ; <-- set to your ESP32 #1 port

; WiFi + HTTPClient + SD + libs can exceed the default 1.3MB app partition.
; huge_app gives a 3MB app slot (no OTA; we log to SD, not SPIFFS).
board_build.partitions = huge_app.csv

lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  adafruit/RTClib@^2.1.4
  plerup/EspSoftwareSerial@^8.2.0
  robtillaart/INA226@^0.6.0
; SD, Wire, Preferences, HardwareSerial, WiFi, HTTPClient ship with the ESP32 Arduino core.
