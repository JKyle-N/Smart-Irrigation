; PlatformIO Project Configuration File — ESP32 #2, PRESENTATION VARIANT
; Standalone copy of ESP2/src/main.cpp, currently byte-identical to production: the stage/progress
; reporting the run screen needs (STAGE / PROG) lives in the real firmware, so nothing had to change.
; It exists so ESP2 timings/behaviour can be tweaked for a presentation without touching production.
; Only needed when Run Mode = RIG; in OFFLINE mode ESP2 is not used at all.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM8

monitor_dtr = 0
monitor_rts = 0

lib_deps =
  mandulaj/PZEM-004T-v30@^1.1.2
; PCF8575 driven via raw I2C (Wire). Wire / HardwareSerial / esp_task_wdt ship with the core.
